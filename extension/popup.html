<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trade Side</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="hand">paste nothing, type nothing</p>
        <h1><svg class="dot" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 C 78 4, 96 28, 92 54 C 88 82, 62 98, 36 92 C 12 86, 2 60, 8 36 C 13 18, 30 10, 50 8 Z" /></svg>Add to Trade Side</h1>
        <svg class="doodle" viewBox="0 0 120 120" aria-hidden="true"><path d="M22 62 L60 24 L98 24 L98 62 L60 100 Z" fill="var(--ochre)"></path><circle cx="84" cy="38" r="5.5" fill="var(--paper)"></circle><path d="M84 38 C 96 30, 104 20, 112 10"></path><path d="M46 64 L62 48"></path><path d="M56 74 L76 54"></path></svg>
      </header>

      <p id="status" class="muted" role="status">Checking your sign-in.</p>

      <section id="signin" hidden>
        <p>Sign in to Trade Side, then press the button again.</p>
        <button id="open-signin" class="btn btn-primary" type="button">Sign in</button>
      </section>

      <form id="clip" hidden>
        <div class="page">
          <p id="page-title" class="page-title"></p>
          <p id="page-site" class="muted"></p>
        </div>
        <p id="pin-note" class="muted" hidden>This is a pin. Trade Side will follow it to the page it came from.</p>
        <label class="label" for="project">Project</label>
        <input id="project" class="field" list="projects" autocomplete="off" placeholder="Client or job name" />
        <datalist id="projects"></datalist>
        <button id="add" class="btn btn-primary" type="submit">Add this page</button>
      </form>

      <section id="done" hidden>
        <p id="done-text"></p>
        <button id="open-item" class="btn btn-primary" type="button">Open the item</button>
      </section>

      <p id="error" class="error" role="alert" hidden></p>

      <details id="settings">
        <summary>Settings</summary>
        <label class="label" for="server">Trade Side address</label>
        <input id="server" class="field" inputmode="url" spellcheck="false" />
        <p class="hint">Only change this if someone at Trade Side asked you to.</p>
        <button id="save-server" class="btn btn-quiet" type="button">Save</button>
      </details>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
